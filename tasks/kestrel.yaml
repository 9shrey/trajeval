- id: open-billing-bug
  category: open_ended
  prompt: Review /src/billing.py. Does order_total do what its docstring says? Explain any bug and how to fix it.
  check: [{type: judge}]
  rubric:
    - "Identifies that GST is computed on the undiscounted subtotal instead of the discounted price."
    - "Explains the effect: customers with a discount are overcharged tax (no effect when discount is 0)."
    - "Gives the fix: compute tax on the discounted amount (tax = discounted * rate)."
  reference: "No. The docstring says GST is added on the discounted price, but the code computes tax = subtotal * rate, i.e. on the pre-discount subtotal. Any order with a discount is overcharged GST (orders without a discount are unaffected). Fix it by computing tax = discounted * GST_RATE[category]."
  gold:
    calls: [{tool: read_file, args: {path: /src/billing.py}}]

