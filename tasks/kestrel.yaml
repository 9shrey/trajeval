  reference: "An over-the-air battery firmware update (v2.3.1) at the end of September had a bug that made some Battery Pack 48V owners see their range estimate fall to 0 km while about 20% charge remained. The bikes still worked, with pedal assist at its lowest level, and there was no safety risk. We rolled affected bikes back within days and released a corrected version, v2.3.2, on 10 October; it installs automatically when the bike connects to the app over Wi-Fi."
