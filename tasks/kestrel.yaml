# Kestrel Cycles task suite.
#
# Every task has a gold trajectory (tool calls + final answer). tests/test_suite.py replays
# each gold trajectory against a fresh world and asserts the checker passes it, so every
# task is solvable and every checker accepts a correct answer.
#
# check types (all listed checks must pass):
#   number:       final answer contains `value` (within `tol`, absolute)
#   contains:     final answer contains every item; an item that is a list means any-of
#   not_contains: final answer contains none of the items
#   refusal:      final answer says the thing does not exist / cannot be found
#   file:         world file `path` exists and contains every item of `contains`
#   email:        an email to `to` was sent; subject/body contain the given items
#   no_email:     no email was sent
#   meeting:      a meeting on `date` with exactly `attendees` was created
#   judge:        open-ended; graded by the LLM judge against `rubric` and `reference`
#
# gold.calls is the minimal tool path; its length is the efficiency baseline.

# ---------------------------------------------------------------- lookup (single tool)
