# ---------------------------------------------------------------- open-ended (LLM judge)
- id: open-incident-summary-checkout
  category: open_ended
  prompt: Summarise the 14 September checkout outage for the leadership team in two or three sentences, covering impact, root cause and fix.
  check: [{type: judge}]
  rubric:
    - "States the root cause: an expired TLS certificate on the payment webhook endpoint, because its auto-renewal cron job was disabled during the 2 September migration."
    - "States the fix: the certificate was renewed and renewal re-enabled, and/or an expiry alert was added."
    - "Gives at least one correct impact figure: 85 minutes (19:40-21:05 IST), about 140 failed checkouts, about Rs 6.2 lakh delayed, or 23 orders lost."
    - "Contains no figure or cause that contradicts the incident report."
  reference: "On 14 September checkout payments failed for 85 minutes (19:40-21:05 IST), causing about 140 failed checkouts and roughly Rs 6.2 lakh of delayed orders, 23 of which were never completed. The cause was an expired TLS certificate on the payment webhook endpoint, whose auto-renewal job had been disabled during the 2 September server migration. We renewed the certificate, re-enabled renewal, and added an alert 14 days before any certificate expires."
  gold:
    calls: [{tool: read_file, args: {path: /incidents/2025-09-14-checkout-outage.md}}]

- id: open-incident-battery-explainer
