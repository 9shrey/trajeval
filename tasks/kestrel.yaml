# ---------------------------------------------------------------- multi-step
- id: multi-revenue-bengaluru
  category: multi_step
  prompt: What is the total revenue (quantity times product price) from non-cancelled orders placed by customers based in Bengaluru?
  check: [{type: number, value: 984480}]
  gold:
    calls:
      - {tool: get_db_schema, args: {}}
      - {tool: sql_query, args: {query: "SELECT SUM(o.quantity * p.price_inr) FROM orders o JOIN customers c ON c.id = o.customer_id JOIN products p ON p.id = o.product_id WHERE c.city = 'Bengaluru' AND o.status != 'cancelled'"}}
    answer: Rs 984480.

- id: multi-top-customer
  category: multi_step
  prompt: Which customer has spent the most on non-cancelled orders, and how much?
  check: [{type: contains, items: [Lakshmi Krishnan]}, {type: number, value: 239997}]
  gold:
    calls:
      - {tool: get_db_schema, args: {}}
      - {tool: sql_query, args: {query: "SELECT c.name, SUM(o.quantity * p.price_inr) AS spent FROM orders o JOIN customers c ON c.id = o.customer_id JOIN products p ON p.id = o.product_id WHERE o.status != 'cancelled' GROUP BY c.id ORDER BY spent DESC LIMIT 3"}}
    answer: Lakshmi Krishnan, who has spent Rs 239997.

- id: multi-best-seller-units
