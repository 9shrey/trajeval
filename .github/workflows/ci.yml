name: ci
on: [push, pull_request]
jobs:
  test:
    # No GPU or model here: the suite, tools, agent loops (against a scripted fake LLM), scoring,
    # statistics and the exporter are all tested offline.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]" ruff
      - run: ruff check trajeval scripts tests
      - run: pytest -q
  regression-gate:
    # The committed A/A pair is the same config run twice with different seeds: the gate must
    # pass it. This is how a real pipeline would gate a model/prompt change on a fresh run.
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      - run: trajeval diff qwen1.5b-v2 qwen1.5b-v2-rerun --checker-only --fail-on-regression
