[project]
name = "trajeval"
version = "0.1.0"
description = "An evaluation harness for tool-using LLM agents: trajectory scoring, significance-aware regression tracking, and an LLM judge calibrated against labels."
requires-python = ">=3.10"
dependencies = [
  "httpx>=0.27",
  "jsonschema>=4.20",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "scipy>=1.11"]

[project.scripts]
trajeval = "trajeval.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["trajeval*"]

[tool.setuptools.package-data]
trajeval = ["world/**/*", "world/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP"]
ignore = ["E501", "UP007", "UP045", "B905", "UP035", "UP037"]
